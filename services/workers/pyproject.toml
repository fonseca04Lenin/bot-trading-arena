[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "websockets>=13",
  "pydantic>=2.8",
  "anthropic>=0.40",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]
# The Analyst's forecasting model. Install torch from the CPU index first (see deploy/Dockerfile.python): the default
# Linux wheel drags in gigabytes of GPU libraries this never uses.
forecast = ["torch>=2.2,<3", "numpy>=1.26,<3", "pandas>=2.2,<4", "einops>=0.8,<1", "huggingface_hub>=0.33,<2",
            "safetensors>=0.5,<1", "tqdm>=4.66,<5"]

[project.scripts]
arena-ingest = "arena_workers.ingest.main:run"
arena-strategies = "arena_workers.strategies.main:run"
arena-scorer = "arena_workers.scorer.main:run"
arena-analyst = "arena_workers.analyst.main:run"

[tool.setuptools.packages.find]
include = ["arena_workers*"]

[tool.setuptools.package-data]
"arena_workers" = ["py.typed"]
"arena_workers.analyst" = ["prompt.md"]
"arena_workers.vendor.kronos" = ["LICENSE", "NOTICE.md"]

[tool.ruff]
line-length = 100
extend-exclude = ["arena_workers/vendor"]

[tool.mypy]
strict = true
exclude = ["arena_workers/vendor/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psycopg.*", "websockets.*", "torch.*", "pandas.*", "numpy.*", "huggingface_hub.*"]
ignore_missing_imports = true

# Vendored upstream code is untyped. Excluding it and skipping its imports makes mypy treat what we import from it
# as Any, instead of reporting every call into it.
[[tool.mypy.overrides]]
module = ["arena_workers.vendor.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "E741"]
